name: Validate upstream fixes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/generate_smithing_enchantment_preservation.py --check
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: matcha-flavoured-upstream-fixes
          path: dist/*.zip
